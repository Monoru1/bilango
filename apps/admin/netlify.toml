[build]
  command = "npm run build -w @gobilan/admin && node scripts/configure-netlify.mjs admin"
  publish = "apps/admin/dist"

[[edge_functions]]
  path = "/v1/*"
  function = "api-client-ip"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/api-unavailable.json"
  [headers.values]
    Cache-Control = "no-store"
    Content-Type = "application/json; charset=utf-8"
